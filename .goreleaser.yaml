# goreleaser config for metha. See https://goreleaser.com
#
# metha ships as linux deb/rpm packages only. No tarball archives are produced
# (the archive phase is skipped via --skip=archive, see the Makefile).
#
# Local dry run:   make snapshot   (writes packages to ./dist, no publishing)
# Real release:    git tag vX.Y.Z && make release   (needs GITHUB_TOKEN)
version: 2

project_name: metha

before:
  hooks:
    - go mod tidy

# One build, linux/amd64+arm64 only. It feeds the nfpm packages below, which
# add the legacy names as symlinks to it. Before 0.5 this was one build per
# command, and each one linked the whole program - the 11MB endpoint list
# included - for about 186MB of binaries doing what 25MB does now.
# CGO disabled on purpose, see https://github.com/miku/metha/issues/31
builds:
  - id: metha
    binary: metha
    main: ./cmd/metha
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    # Inject the version (from the git tag) into the shared metha package var,
    # not main.version. Local builds keep the "dev" default from version.go.
    ldflags: [-s, -w, "-X github.com/miku/metha.Version={{.Version}}"]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux]
    goarch: [amd64, arm64]

# Linux packages, mirrors the previous nfpm.yaml.
nfpms:
  - id: packages
    package_name: metha
    vendor: Leipzig University Library
    homepage: https://github.com/miku/metha
    maintainer: Martin Czygan <martin.czygan@uni-leipzig.de>
    description: No frills incremental OAI harvesting for the command line.
    license: GPL
    section: utils
    priority: optional
    formats: [deb, rpm]
    # Native package naming: metha_0.4.29_amd64.deb, metha-0.4.29.x86_64.rpm
    file_name_template: "{{ .ConventionalFileName }}"
    umask: 0o002
    bindir: /usr/local/bin
    contents:
      - src: docs/metha.1
        dst: /usr/local/share/man/man1/metha.1
        file_info:
          mode: 0644
      - src: extra/linux/metha.service
        dst: /usr/lib/systemd/system/metha.service
        file_info:
          mode: 0644
      # The names metha installed until 0.4, as symlinks to the one binary. It
      # dispatches on the name it was invoked under, so these keep taking the
      # flags they always did. Removed in metha 2.0.
      - src: /usr/local/bin/metha
        dst: /usr/local/bin/metha-sync
        type: symlink
      - src: /usr/local/bin/metha
        dst: /usr/local/bin/metha-cat
        type: symlink
      - src: /usr/local/bin/metha
        dst: /usr/local/bin/metha-id
        type: symlink
      - src: /usr/local/bin/metha
        dst: /usr/local/bin/metha-ls
        type: symlink
      - src: /usr/local/bin/metha
        dst: /usr/local/bin/metha-files
        type: symlink
      - src: /usr/local/bin/metha
        dst: /usr/local/bin/metha-fortune
        type: symlink
      - src: /usr/local/bin/metha
        dst: /usr/local/bin/metha-stat
        type: symlink
      - src: /usr/local/bin/metha
        dst: /usr/local/bin/metha-migrate
        type: symlink
    deb:
      compression: zstd
    rpm:
      compression: zstd

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^Merge "

release:
  github:
    owner: miku
    name: metha
